<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scramjet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
    <style>
        :root {
            /* Dark Mode Defaults */
            --bg: ##111111;
            --shade: #111213;
            --select: #1F1F21;
            --text: #FFFFFF;
            --text-muted: #888888;
            --radius: 8px;
            --radius-sm: 6px;
            --radius-xs: 4px;
            --t: 0.1s ease;
        }

        :root[data-theme="light"] {
            /* Light Mode Overrides */
            --bg: #FFFFFF;
            --shade: #F8F8F8;
            --select: #E2E3E4;
            --text: #000000;
            --text-muted: #666666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            height: 100vh;
            overflow: hidden;
            color: var(--text);
            transition: background var(--t), color var(--t);
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: var(--shade);
            align-items: center;
            transition: background var(--t);
            z-index: 10;
            flex-shrink: 0;
        }

        .nav-buttons {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
        }

        button {
            background: var(--bg);
            border: 1px solid transparent; /* Prevents layout shift on hover */
            color: var(--text);
            padding: 0;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 18px;
            transition: background var(--t), border-color var(--t), transform var(--t);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            font-family: 'Inter', system-ui, sans-serif;
        }

        /* Applied to both hover and active states for the 1px black border */
        button:hover, button.active {
            background: var(--select);
            border-color: #000000;
        }

        button:active {
            transform: scale(0.92);
        }

        /* Uniform URL bar to match the search box on the new-tab page */
        .url-bar {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            background: var(--shade);
            border-radius: var(--radius);
            padding: 4px 4px 4px 16px;
            transition: border-color var(--t), background var(--t);
            position: relative;
            height: 44px; /* Matches the search page height */
            border: 1px solid var(--select);
        }

        .url-bar:focus-within {
            border-color: var(--text); /* Clean 1px border using text color */
        }

        .url-bar input {
            flex: 1;
            min-width: 0;
            border: none;
            background: transparent;
            color: var(--text);
            font-size: 16px; /* Matches search page font size */
            outline: none;
            font-family: 'Inter', system-ui, sans-serif;
            height: 100%;
        }

        .url-bar input::placeholder {
            color: var(--text-muted);
        }

        .settings-btn {
            width: 34px;
            height: 34px;
            border-radius: var(--radius-sm);
            font-size: 17px;
            flex-shrink: 0;
        }

        iframe {
            width: 100%;
            flex: 1;
            border: none;
            background: white;
            min-height: 0;
        }

        /* ── Settings dropdown ── */
        .settings-dropdown {
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            background: var(--shade);
            border: 1px solid #000000;
            border-radius: var(--radius);
            padding: 16px;
            min-width: 260px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            z-index: 1000;
            opacity: 0;
            transform: translateY(-4px) scale(0.98);
            pointer-events: none;
            transition: opacity var(--t), transform var(--t);
            font-family: 'Inter', system-ui, sans-serif;
        }

        .settings-dropdown.open {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .settings-section {
            margin-bottom: 16px;
        }

        .settings-section:last-child {
            margin-bottom: 0;
        }

        .settings-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 700;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .theme-toggle {
            display: flex;
            gap: 4px;
            background: var(--bg);
            border-radius: var(--radius-sm);
            padding: 4px;
        }

        .theme-toggle button {
            flex: 1;
            height: 32px;
            font-size: 13px;
            font-weight: 500;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid transparent;
            border-radius: var(--radius-xs);
            width: auto;
            transition: background var(--t), color var(--t), border-color var(--t);
            font-family: 'Inter', system-ui, sans-serif;
        }

        .theme-toggle button.active {
            background: var(--select);
            color: var(--text);
            border-color: #000000;
        }

        .theme-toggle button:hover:not(.active) {
            color: var(--text);
            border-color: #000000;
        }

        .select-wrap {
            position: relative;
        }

        .engine-select {
            width: 100%;
            padding: 10px 32px 10px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid transparent;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            font-family: 'Inter', system-ui, sans-serif; /* Inter explicitly set */
            outline: none;
            cursor: pointer;
            transition: border-color var(--t), background var(--t);
            appearance: none;
            -webkit-appearance: none;
        }

        .engine-select:hover {
            border-color: #000000;
        }

        .engine-select option {
            background: var(--shade);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
        }

        .select-arrow {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--text-muted);
            font-size: 16px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="toolbar">
            <div class="nav-buttons">
                <button id="backBtn" title="Back" aria-label="Go back"><i class="ti ti-arrow-left"></i></button>
                <button id="forwardBtn" title="Forward" aria-label="Go forward"><i class="ti ti-arrow-right"></i></button>
                <button id="reloadBtn" title="Reload" aria-label="Reload page"><i class="ti ti-refresh"></i></button>
            </div>
            <div class="url-bar">
                <input type="text" id="urlInput" placeholder="Search or enter URL...">
                <button class="settings-btn" id="settingsBtn" title="Settings" aria-label="Settings"><i class="ti ti-settings"></i></button>
                <div class="settings-dropdown" id="settingsDropdown">
                    <div class="settings-section">
                        <div class="settings-label">Theme</div>
                        <div class="theme-toggle">
                            <button data-theme-val="auto">Auto</button>
                            <button data-theme-val="light">Light</button>
                            <button data-theme-val="dark">Dark</button>
                        </div>
                    </div>
                    <div class="settings-section">
                        <div class="settings-label">Search Engine</div>
                        <div class="select-wrap">
                            <select class="engine-select" id="engineSelect">
                                <option value="ddg">DuckDuckGo</option>
                                <option value="bing">Bing</option>
                                <option value="google">Google</option>
                                <option value="brave">Brave</option>
                                <option value="qwant">Qwant</option>
                            </select>
                            <i class="ti ti-chevron-down select-arrow"></i>
                        </div>
                    </div>
                </div>
            </div>
            <button id="homeBtn" title="New Tab" aria-label="New tab"><i class="ti ti-home"></i></button>
        </div>
        <iframe id="browserFrame" title="Scramjet Browser"></iframe>
    </div>

    <script src="/scramjet/scramjet.js"></script>
    <script src="/controller/controller.api.js"></script>
    <script src="/transport/index.js"></script>

    <script>
        const { Controller } = $scramjetController;
        const { defaultConfig } = $scramjet;
        const EpoxyTransport = self.EpoxyTransport.default;

        const iframe        = document.getElementById("browserFrame");
        const urlInput      = document.getElementById("urlInput");
        const settingsBtn   = document.getElementById("settingsBtn");
        const settingsDrop  = document.getElementById("settingsDropdown");
        const engineSelect  = document.getElementById("engineSelect");
        const homeBtn       = document.getElementById("homeBtn");

        const searchEngines = {
            ddg:    { name: 'DuckDuckGo', url: 'https://duckduckgo.com/?q=' },
            bing:   { name: 'Bing',       url: 'https://www.bing.com/search?q=' },
            google: { name: 'Google',     url: 'https://www.google.com/search?q=' },
            brave:  { name: 'Brave',      url: 'https://search.brave.com/search?q=' },
            qwant:  { name: 'Qwant',      url: 'https://www.qwant.com/?q=' }
        };

        /* ── persisted settings ── */
        let settings = {
            theme: localStorage.getItem('scramjet-theme')  || 'auto',
            engine: localStorage.getItem('scramjet-engine') || 'ddg'
        };

        let scramjet = null;
        let frame    = null;
        let onNewTab = true;

        /* ── theme helpers ── */
        function getEffectiveTheme() {
            if (settings.theme === 'auto') {
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            return settings.theme;
        }

        function applyTheme() {
            document.documentElement.setAttribute('data-theme', getEffectiveTheme());
        }

        function saveSettings() {
            localStorage.setItem('scramjet-theme',  settings.theme);
            localStorage.setItem('scramjet-engine', settings.engine);
        }

        function updateSettingsUI() {
            document.querySelectorAll('.theme-toggle button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.themeVal === settings.theme);
            });
            engineSelect.value = settings.engine;
        }

        /* ── new-tab page ── */
        function newTabHtml() {
            const isDark   = getEffectiveTheme() === 'dark';
            const bg       = isDark ? '#000000' : '#FFFFFF';
            const shade    = isDark ? '#111213' : '#F8F8F8';
            const select   = isDark ? '#1F1F21' : '#E2E3E4';
            const text     = isDark ? '#FFFFFF' : '#000000';
            const muted    = isDark ? '#888888' : '#666666';
            const engineNm = searchEngines[settings.engine].name;

            return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:${bg};color:${text};font-family:'Inter',system-ui,sans-serif;
    transition:background .1s,color .1s;
    animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
h1{font-weight:800;font-size:48px;margin-bottom:28px;letter-spacing:-1.5px}
.search-wrap{width:100%;max-width:560px;padding:0 20px}
.search-box{
    width:100%;padding:14px 20px;border-radius:8px;border:1px solid ${select};
    background:${shade};color:${text};font-size:16px;outline:none;
    font-family:'Inter',system-ui,sans-serif;transition:border-color .1s,background .1s;
}
.search-box::placeholder{color:${muted}}
.search-box:focus{border-color:${text}}
.engine-hint{text-align:center;margin-top:12px;font-size:12px;color:${muted};font-weight:500}
</style>
</head>
<body>
<h1>Scramjet</h1>
<div class="search-wrap">
<input class="search-box" type="text" placeholder="Search the web..." autofocus>
<div class="engine-hint">Searching with ${engineNm}</div>
</div>
<script>
document.querySelector('.search-box').addEventListener('keydown',function(e){
    if(e.key==='Enter'){
        var q=e.target.value.trim();
        if(q)window.parent.postMessage({type:'search',query:q},'*');
    }
});
<\/script>
</body>
</html>`;
        }

        function showNewTab() {
            onNewTab = true;
            urlInput.value = '';
            iframe.removeAttribute('src');
            iframe.srcdoc = newTabHtml();
        }

        /* ── navigation ── */
        function navigateTo(input) {
            const trimmed = input.trim();
            if (!trimmed) return;

            let url;
            if (/^https?:\/\//i.test(trimmed)) {
                url = trimmed;
            } else if (/^[^\s]+\.[^\s]+$/.test(trimmed) && !trimmed.includes(' ')) {
                url = 'https://' + trimmed;
            } else {
                url = searchEngines[settings.engine].url + encodeURIComponent(trimmed);
            }

            onNewTab = false;
            urlInput.value = url;
            iframe.removeAttribute('srcdoc');
            if (frame) {
                frame.go(url);
            } else {
                console.error('Scramjet not ready yet');
            }
        }

        window.addEventListener('message', e => {
            if (e.data && e.data.type === 'search') {
                navigateTo(e.data.query);
            }
        });

        /* ── settings dropdown controls ── */
        function closeSettings() {
            settingsDrop.classList.remove('open');
            settingsBtn.classList.remove('active');
        }

        settingsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            const open = settingsDrop.classList.toggle('open');
            settingsBtn.classList.toggle('active', open);
        });

        // Close if clicking anywhere else in the document
        document.addEventListener('click', (e) => {
            if (!settingsDrop.contains(e.target) && !settingsBtn.contains(e.target)) {
                closeSettings();
            }
        });

        // Close if the user clicks off into the iframe (iframe steals window focus)
        window.addEventListener('blur', () => {
            if (settingsDrop.classList.contains('open')) {
                closeSettings();
            }
        });

        // Close on Escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeSettings();
        });

        /* theme toggle buttons */
        document.querySelectorAll('.theme-toggle button').forEach(btn => {
            btn.addEventListener('click', () => {
                settings.theme = btn.dataset.themeVal;
                saveSettings();
                applyTheme();
                updateSettingsUI();
                if (onNewTab) showNewTab();
            });
        });

        /* engine select */
        engineSelect.addEventListener('change', () => {
            settings.engine = engineSelect.value;
            saveSettings();
            if (onNewTab) showNewTab();
        });

        /* react to system theme change */
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (settings.theme === 'auto') {
                applyTheme();
                if (onNewTab) showNewTab();
            }
        });

        /* ── URL bar ── */
        urlInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') navigateTo(urlInput.value);
        });

        urlInput.addEventListener('focus', () => urlInput.select());

        /* ── nav buttons ── */
        document.getElementById('backBtn').onclick = () => {
            if (!onNewTab) { try { iframe.contentWindow.history.back(); } catch(e){} }
        };
        document.getElementById('forwardBtn').onclick = () => {
            try { iframe.contentWindow.history.forward(); } catch(e){}
        };
        document.getElementById('reloadBtn').onclick = () => {
            if (onNewTab) { showNewTab(); }
            else { try { iframe.contentWindow.location.reload(); } catch(e){} }
        };
        homeBtn.onclick = () => showNewTab();

        /* ── Scramjet bootstrap ── */
        async function init() {
            try {
                await navigator.serviceWorker.ready;

                const serviceworker =
                    navigator.serviceWorker.controller ??
                    (await navigator.serviceWorker.ready).active;

                const transport = new EpoxyTransport({
                    wisp: "wss://wisp.mercurywork.shop/"
                });
                await transport.init();

                scramjet = new Controller({
                    serviceworker,
                    transport,
                    scramjetConfig: defaultConfig
                });
                await scramjet.wait();

                frame = scramjet.createFrame(iframe);
                showNewTab();
            } catch (e) {
                console.error(e);
            }
        }

        /* ── kick everything off ── */
        applyTheme();
        updateSettingsUI();

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/sw.js").then(init);
        } else {
            console.error("No service worker support");
        }
    </script>
</body>

</html>
